
name: Fraud Detection CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run API tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/ruchi0903/fraud-detection-mlops:latest
            ghcr.io/ruchi0903/fraud-detection-mlops:sha-${{ github.sha }}

      - name: Trigger Render deployment
        if: github.event_name == 'push' && success()
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          ENCODED_IMAGE_URL="ghcr.io%2Fruchi0903%2Ffraud-detection-mlops%3A${IMAGE_TAG}"

          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_IMAGE_URL}"
